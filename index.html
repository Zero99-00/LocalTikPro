<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>TikLocal Pro</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00d2ff",
                        "accent": "#ec13a4",
                        "background-dark": "#050505",
                    },
                    fontFamily: { "display": ["Spline Sans", "sans-serif"] },
                    animation: {
                        'fade-in': 'fadeIn 0.2s ease-out forwards', /* Sped up animation */
                        'scale-pulse': 'scalePulse 0.3s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        scalePulse: {
                            '0%': { transform: 'scale(1)' },
                            '50%': { transform: 'scale(0.9)' },
                            '100%': { transform: 'scale(1)' },
                        }
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; transition: all 0.3s ease; }
        .filled { font-variation-settings: 'FILL' 1; }
        
        /* Video Sizing */
        .video-fit { object-fit: cover; width: 100%; height: 100%; }
        .video-contain { object-fit: contain; width: 100%; height: 100%; background: black; }
        
        .video-wrapper {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            /* PERFORMANCE FIXES FOR HIGH FPS */
            will-change: transform;
            transform: translate3d(0, 0, 0); /* Force GPU Layer */
            backface-visibility: hidden;
            perspective: 1000px;
        }

        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 14px; cursor: pointer; background: transparent; }
        input[type=range]::-webkit-slider-thumb { height: 14px; width: 14px; border-radius: 50%; background: transparent; cursor: pointer; -webkit-appearance: none; margin-top: 0px; }

        .btn-active { color: #00d2ff !important; text-shadow: 0 0 15px rgba(0, 210, 255, 0.4); background: rgba(255, 255, 255, 0.15); }
        .btn-active span { font-variation-settings: 'FILL' 1; }
        
        .glass-panel {
            /* OPTIMIZED: Removed backdrop-filter blur to fix FPS drops */
            background: rgba(15, 15, 15, 0.85); 
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .recent-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); transition: all 0.2s; }
        .recent-btn:hover { background: rgba(255,255,255,0.1); border-color: #00d2ff; }
        .ui-element { transition: opacity 0.3s ease; }
    </style>
</head>
<body class="bg-background-dark text-white font-display flex flex-col relative select-none h-screen w-full overflow-hidden">

    <div id="welcome-screen" class="absolute inset-0 z-[100] flex flex-col items-center justify-center bg-background-dark transition-opacity duration-500">
        <div class="absolute inset-0 opacity-20 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-primary/20 via-transparent to-transparent"></div>
        <h1 class="text-6xl font-bold mb-2 tracking-tighter italic text-white drop-shadow-2xl">Tik<span class="text-primary">Local</span></h1>
        <p class="text-white/40 mb-12 tracking-[0.2em] uppercase text-xs font-semibold">Premium Video Experience</p>
        
        <button id="select-videos" class="group relative px-12 py-4 rounded-full bg-white text-black font-bold hover:scale-105 hover:shadow-[0_0_30px_rgba(255,255,255,0.3)] transition-all duration-300 z-50">
            Open Local Library
        </button>

        <div id="recent-container" class="mt-12 flex flex-col items-center gap-3 z-50 hidden">
            <p class="text-white/30 text-xs uppercase tracking-widest mb-2">Recent Folders</p>
            <div id="recent-list" class="flex flex-col gap-2 w-64"></div>
        </div>
    </div>

    <div id="player-ui" class="hidden absolute inset-0 z-0 h-full w-full bg-black">
        
        <div id="video-click-layer" class="absolute inset-0 z-10 w-full h-full cursor-pointer"></div>
        <div id="video-container" class="relative h-full w-full overflow-hidden pointer-events-none"></div>
        
        <div class="ui-element absolute inset-0 bg-gradient-to-b from-black/80 via-transparent to-black/90 pointer-events-none z-20"></div>

        <div class="ui-element absolute top-8 left-0 right-0 z-30 flex items-center justify-center pointer-events-none">
            <div class="flex gap-4 pointer-events-auto">
                <button id="feed-fyp" class="text-white border-primary border-b-2 px-2 pb-1 font-semibold text-lg transition-colors">For You</button>
                <div class="w-[1px] h-6 bg-white/20 self-center"></div>
                <button id="feed-bookmarks" class="text-white/50 border-transparent border-b-2 px-2 pb-1 font-semibold text-lg hover:text-white transition-colors">Saved</button>
            </div>
        </div>
        
        <button onclick="location.reload()" class="ui-element absolute top-8 right-8 z-40 p-2 rounded-full bg-black/20 hover:bg-white/10 transition-all pointer-events-auto">
            <span class="material-symbols-outlined text-white/70">close</span>
        </button>

        <div class="absolute left-6 bottom-32 z-50 pointer-events-auto">
            <button id="hide-ui-btn" class="h-12 w-12 rounded-full glass-panel flex items-center justify-center hover:bg-white/20 transition-all group" title="Clean View">
                <span id="hide-ui-icon" class="material-symbols-outlined text-2xl text-white/80 group-hover:text-white">visibility_off</span>
            </button>
        </div>

        <div class="ui-element absolute right-4 bottom-28 z-30 flex flex-col items-end gap-6 pointer-events-auto">
            <div class="glass-panel rounded-full p-2 flex flex-col items-center gap-3">
                
                <div class="flex flex-col items-center group">
                    <button id="loop-btn" class="h-10 w-10 rounded-full flex items-center justify-center hover:bg-white/10 active:scale-90 transition-all text-white/50 btn-active">
                        <span class="material-symbols-outlined text-2xl">repeat</span>
                    </button>
                    <span class="text-[9px] font-bold uppercase opacity-60">Loop</span>
                </div>

                 <div class="flex flex-col items-center group">
                    <button id="autoscroll-btn" class="h-10 w-10 rounded-full flex items-center justify-center hover:bg-white/10 active:scale-90 transition-all text-white/50">
                        <span class="material-symbols-outlined text-2xl">playlist_play</span>
                    </button>
                    <span class="text-[9px] font-bold uppercase opacity-60">Auto</span>
                </div>

                <div class="w-6 h-[1px] bg-white/10 my-1"></div>

                <div class="flex flex-col items-center">
                    <button id="like-btn" class="h-12 w-12 rounded-full flex items-center justify-center active:scale-90 transition-all">
                        <span class="material-symbols-outlined text-3xl drop-shadow-lg transition-transform group-hover:scale-110">favorite</span>
                    </button>
                    <span id="like-count" class="text-xs font-bold mt-1 text-white shadow-black drop-shadow-md">0</span>
                </div>

                <div class="flex flex-col items-center">
                    <button id="bookmark-btn" class="h-12 w-12 rounded-full flex items-center justify-center active:scale-90 transition-all">
                        <span class="material-symbols-outlined text-3xl drop-shadow-lg">bookmark</span>
                    </button>
                    <span class="text-xs font-bold mt-1 text-white shadow-black drop-shadow-md">Save</span>
                </div>

                <div class="w-6 h-[1px] bg-white/10 my-1"></div>

                <button id="aspect-ratio-toggle" class="h-10 w-10 rounded-full flex items-center justify-center hover:bg-white/10 transition-all" title="Fit/Fill">
                    <span class="material-symbols-outlined text-xl">crop_free</span>
                </button>
                <button id="horizon-button" class="h-10 w-10 rounded-full flex items-center justify-center hover:bg-white/10 transition-all" title="Rotate">
                    <span class="material-symbols-outlined text-xl">screen_rotation</span>
                </button>
            </div>
        </div>

        <div class="ui-element absolute bottom-0 left-0 right-0 z-30 p-6 bg-gradient-to-t from-black via-black/60 to-transparent pointer-events-auto">
            
            <div class="mb-4 pl-2">
                <div id="filename-display" class="font-bold text-white/90 text-sm truncate w-[70%]">...</div>
            </div>

            <div class="flex items-center gap-4">
                <div class="glass-panel rounded-full px-4 py-3 flex items-center gap-3 flex-1 max-w-xs">
                    <button id="mute-toggle" class="flex items-center justify-center">
                        <span id="vol-icon" class="material-symbols-outlined text-primary text-xl">volume_up</span>
                    </button>
                    <div class="relative flex-1 flex items-center h-4 group cursor-pointer">
                        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1" class="w-full h-full z-20 absolute opacity-0 cursor-pointer">
                        <div class="absolute top-1/2 left-0 w-full h-1 bg-white/20 rounded-full -translate-y-1/2"></div>
                        <div id="volume-progress" class="absolute top-1/2 left-0 h-1 bg-primary rounded-full -translate-y-1/2 pointer-events-none shadow-[0_0_10px_#00d2ff]" style="width: 100%"></div>
                        <div id="volume-thumb" class="absolute top-1/2 h-3 w-3 bg-white rounded-full -translate-y-1/2 shadow-sm pointer-events-none" style="left: 100%"></div>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button id="jump-top" class="h-12 w-10 rounded-l-full glass-panel flex items-center justify-center hover:bg-white/20 active:scale-95 transition-all border-r-0 mr-[1px]">
                         <span class="material-symbols-outlined">keyboard_double_arrow_up</span>
                    </button>
                    <button id="scroll-up" class="h-12 w-12 rounded-none glass-panel flex items-center justify-center hover:bg-white/20 active:scale-95 transition-all">
                        <span class="material-symbols-outlined">keyboard_arrow_up</span>
                    </button>
                    <button id="scroll-down" class="h-12 w-12 rounded-none glass-panel flex items-center justify-center hover:bg-white/20 active:scale-95 transition-all">
                        <span class="material-symbols-outlined">keyboard_arrow_down</span>
                    </button>
                    <button id="jump-bottom" class="h-12 w-10 rounded-r-full glass-panel flex items-center justify-center hover:bg-white/20 active:scale-95 transition-all border-l-0 ml-[1px]">
                         <span class="material-symbols-outlined">keyboard_double_arrow_down</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const fs = require('fs');
        const path = require('path');

        // State
        let allVideos = [];
        let bookmarkedVideos = JSON.parse(localStorage.getItem('bookmarks')) || [];
        let likedVideosCount = JSON.parse(localStorage.getItem('likesCount')) || {};
        let recentFolders = JSON.parse(localStorage.getItem('recentFolders')) || [];
        let lastSession = JSON.parse(localStorage.getItem('lastSession')) || {};
        
        let currentPlaylist = [];
        let currentVideoIndex = 0;
        let activeFolder = ""; 

        let fypIndex = 0;
        let savedIndex = 0;

        let isFitMode = false;
        let isHorizontal = false;
        let isAutoScroll = false;
        let isLoop = true; 
        let viewMode = 'fyp';
        let isUiHidden = false;

        // UI Elements
        const welcome = document.getElementById('welcome-screen');
        const player = document.getElementById('player-ui');
        const container = document.getElementById('video-container');
        const clickLayer = document.getElementById('video-click-layer');
        const volSlider = document.getElementById('volume-slider');
        const volProgress = document.getElementById('volume-progress');
        const volThumb = document.getElementById('volume-thumb');
        const filenameDisplay = document.getElementById('filename-display');
        
        const btnAuto = document.getElementById('autoscroll-btn');
        const btnLoop = document.getElementById('loop-btn');
        const btnHideUi = document.getElementById('hide-ui-btn');
        const iconHideUi = document.getElementById('hide-ui-icon');
        const fypBtn = document.getElementById('feed-fyp');
        const bookBtn = document.getElementById('feed-bookmarks');

        // --- INITIALIZATION ---
        loadRecentFolders();
        updateLoopUI();
        updateAutoScrollUI();

        // --- PAUSE TOGGLE ---
        clickLayer.onclick = () => {
            const video = container.querySelector('video');
            if (!video) return;
            if (video.paused) video.play(); else video.pause();
        };

        // --- RECENT FOLDERS ---
        function loadRecentFolders() {
            const list = document.getElementById('recent-list');
            const container = document.getElementById('recent-container');
            list.innerHTML = '';
            if (recentFolders.length > 0) {
                container.classList.remove('hidden');
                recentFolders.forEach(folderPath => {
                    const btn = document.createElement('button');
                    btn.className = 'recent-btn w-full py-2 px-4 rounded-lg text-left text-xs text-white/70 truncate flex items-center gap-2';
                    const name = path.basename(folderPath);
                    btn.innerHTML = `<span class="material-symbols-outlined text-sm">folder</span> ${name}`;
                    btn.onclick = () => loadVideosFromFolder(folderPath);
                    list.appendChild(btn);
                });
            }
        }

        function saveRecentFolder(folderPath) {
            recentFolders = recentFolders.filter(p => p !== folderPath);
            recentFolders.unshift(folderPath);
            if (recentFolders.length > 5) recentFolders.pop();
            localStorage.setItem('recentFolders', JSON.stringify(recentFolders));
        }

        // --- LOAD VIDEOS ---
        document.getElementById('select-videos').addEventListener('click', async () => {
            const folder = await ipcRenderer.invoke('dialog:openDirectory');
            if (folder && folder.length > 0) loadVideosFromFolder(folder[0]);
        });

        function loadVideosFromFolder(folderPath) {
            try {
                activeFolder = folderPath;
                const files = fs.readdirSync(folderPath);
                
                const videoFiles = files
                    .filter(f => f.match(/\.(mp4|webm|mkv|mov|avi|m4v|hevc|h265|ts|mts|m2ts|3gp|flv|wmv|f4v|ogv|divx|xvid)$/i))
                    .map(f => {
                        const fullPath = path.join(folderPath, f);
                        try {
                            const stats = fs.statSync(fullPath);
                            return { path: fullPath, time: stats.birthtime.getTime() };
                        } catch (e) { return null; }
                    })
                    .filter(f => f !== null);

                if (videoFiles.length > 0) {
                    saveRecentFolder(folderPath);
                    videoFiles.sort((a, b) => a.time - b.time);
                    allVideos = videoFiles.map(f => f.path);
                    
                    welcome.style.opacity = '0';
                    setTimeout(() => {
                        welcome.classList.add('hidden');
                        player.classList.remove('hidden');
                        
                        if (lastSession.folder === folderPath && lastSession.videoPath) {
                            const lastIdx = allVideos.indexOf(lastSession.videoPath);
                            if (lastIdx !== -1) fypIndex = lastIdx;
                        } else {
                            fypIndex = 0;
                        }
                        setFeed('fyp');
                    }, 500);
                } else {
                    alert("No supported video files found!");
                }
            } catch (e) {
                console.error(e);
                alert("Could not open folder: " + e.message);
            }
        }

        function setFeed(mode) {
            if (viewMode === 'fyp') fypIndex = currentVideoIndex;
            else savedIndex = currentVideoIndex;

            viewMode = mode;

            if (mode === 'fyp') {
                currentPlaylist = allVideos;
                currentVideoIndex = (fypIndex < currentPlaylist.length) ? fypIndex : 0;
                fypBtn.className = 'text-white border-primary border-b-2 px-2 pb-1 font-semibold text-lg';
                bookBtn.className = 'text-white/50 border-transparent border-b-2 px-2 pb-1 font-semibold text-lg hover:text-white transition-colors';
            } else {
                currentPlaylist = bookmarkedVideos;
                currentVideoIndex = (savedIndex < currentPlaylist.length) ? savedIndex : 0;
                bookBtn.className = 'text-white border-primary border-b-2 px-2 pb-1 font-semibold text-lg';
                fypBtn.className = 'text-white/50 border-transparent border-b-2 px-2 pb-1 font-semibold text-lg hover:text-white transition-colors';
            }
            
            container.innerHTML = ''; 
            if (currentPlaylist.length > 0) displayVideo(currentVideoIndex);
            else container.innerHTML = `<div class="flex items-center justify-center h-full text-white/30 text-xl font-bold">No videos yet</div>`;
        }

        // --- OPTIMIZED VIDEO PLAYER ---
        function displayVideo(index) {
            if(!currentPlaylist[index]) return;
            const videoPath = currentPlaylist[index];
            const cleanName = path.basename(videoPath);
            filenameDisplay.innerText = cleanName;

            if (viewMode === 'fyp') {
                localStorage.setItem('lastSession', JSON.stringify({
                    folder: activeFolder,
                    videoPath: videoPath
                }));
            }

            const safePath = videoPath.split(path.sep).map(encodeURIComponent).join('/');

            // PERFORMANCE FIX: Pause old videos INSTANTLY to free up Audio/Video Decoder
            const oldVideos = container.querySelectorAll('video');
            oldVideos.forEach(v => {
                v.pause(); // Critical for audio sync
                v.removeAttribute('src'); // Stop buffering
                v.load();
            });
            const oldErrors = container.querySelectorAll('.error-msg');
            oldErrors.forEach(e => e.remove());

            // Create Video
            const newVideo = document.createElement('video');
            newVideo.src = `file:///${safePath}`;
            newVideo.className = `video-wrapper ${isFitMode ? 'video-contain' : 'video-fit'} opacity-0`;
            newVideo.style.zIndex = '1'; 
            newVideo.volume = volSlider.value;
            newVideo.loop = isLoop;
            
            // OPTIMIZATION FLAGS
            newVideo.preload = "auto";
            newVideo.disablePictureInPicture = true;
            newVideo.setAttribute('disableRemotePlayback', ''); // Prevents scanning for airplay
            newVideo.setAttribute('x-webkit-airplay', 'deny');

            let retryCount = 0;
            newVideo.onerror = (e) => {
                const err = newVideo.error;
                console.log("Video Error:", err);
                if (retryCount === 0) {
                    retryCount++;
                    setTimeout(() => newVideo.load(), 50);
                    return;
                }
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-msg absolute inset-0 flex flex-col items-center justify-center z-20 bg-black/80 text-white';
                errorDiv.innerHTML = `
                    <span class="material-symbols-outlined text-5xl text-red-500 mb-2">warning</span>
                    <p class="font-bold">Format Not Supported</p>
                    <p class="text-[10px] text-white/50 mt-1">Install HEVC Extensions</p>
                `;
                container.appendChild(errorDiv);
            };

            newVideo.onended = () => {
                if (isAutoScroll && !isLoop) nextVideo();
            };

            container.appendChild(newVideo);

            // Play
            newVideo.play().then(() => {
                newVideo.classList.remove('opacity-0');
                newVideo.classList.add('animate-fade-in');
                // Remove old elements faster to prevent overlap lag
                setTimeout(() => oldVideos.forEach(v => v.remove()), 50); 
            }).catch(e => console.log("Autoplay blocked"));

            updateActionButtons(videoPath);
        }

        // --- NAVIGATION ---
        function nextVideo() {
            if (currentVideoIndex < currentPlaylist.length - 1) {
                currentVideoIndex++;
                displayVideo(currentVideoIndex);
            } else if (isAutoScroll) {
                currentVideoIndex = 0;
                displayVideo(0);
            }
        }

        function prevVideo() {
            if (currentVideoIndex > 0) {
                currentVideoIndex--;
                displayVideo(currentVideoIndex);
            }
        }

        document.getElementById('jump-top').onclick = () => { currentVideoIndex = 0; displayVideo(0); };
        document.getElementById('jump-bottom').onclick = () => {
            if (currentPlaylist.length > 0) {
                currentVideoIndex = currentPlaylist.length - 1;
                displayVideo(currentVideoIndex);
            }
        };

        // --- SCROLL LOGIC ---
        let lastScrollTime = 0;
        const SCROLL_COOLDOWN = 600;

        window.addEventListener('wheel', (e) => {
            if (player.classList.contains('hidden')) return;
            const now = Date.now();
            if (now - lastScrollTime < SCROLL_COOLDOWN) return;
            if (Math.abs(e.deltaY) < 40) return;

            lastScrollTime = now;
            if (e.deltaY > 0) nextVideo();
            else prevVideo();
        }, { passive: true });

        // --- HIDE UI ---
        btnHideUi.onclick = () => {
            isUiHidden = !isUiHidden;
            const uiElements = document.querySelectorAll('.ui-element, #video-click-layer button');
            if(isUiHidden) {
                uiElements.forEach(el => { 
                    if(!el.contains(btnHideUi)) { el.classList.add('opacity-0', 'pointer-events-none'); }
                });
                iconHideUi.innerText = 'visibility';
                btnHideUi.classList.add('opacity-30', 'hover:opacity-100');
            } else {
                uiElements.forEach(el => { el.classList.remove('opacity-0', 'pointer-events-none'); });
                iconHideUi.innerText = 'visibility_off';
                btnHideUi.classList.remove('opacity-30', 'hover:opacity-100');
            }
        };

        document.addEventListener('keydown', (e) => {
            if(player.classList.contains('hidden')) return;
            const now = Date.now();
            if(e.key === 'ArrowDown') { if (now - lastScrollTime > 300) { lastScrollTime = now; nextVideo(); } }
            if(e.key === 'ArrowUp') { if (now - lastScrollTime > 300) { lastScrollTime = now; prevVideo(); } }
            if(e.key === ' ') { clickLayer.click(); }
            if(e.key.toLowerCase() === 'h') btnHideUi.click();
        });

        // --- ACTIONS ---
        function updateActionButtons(vPath) {
            const likeBtnIcon = document.getElementById('like-btn').querySelector('span');
            const bookBtnIcon = document.getElementById('bookmark-btn').querySelector('span');
            
            const count = likedVideosCount[vPath] || 0;
            document.getElementById('like-count').innerText = count > 0 ? count : "Like";
            
            if (count > 0) likeBtnIcon.classList.add('filled', 'text-red-500');
            else likeBtnIcon.classList.remove('filled', 'text-red-500');

            if (bookmarkedVideos.includes(vPath)) bookBtnIcon.classList.add('filled', 'text-primary');
            else bookBtnIcon.classList.remove('filled', 'text-primary');
        }

        document.getElementById('like-btn').onclick = () => {
            const vPath = currentPlaylist[currentVideoIndex];
            if (!vPath) return;
            likedVideosCount[vPath] = (likedVideosCount[vPath] || 0) + 1;
            localStorage.setItem('likesCount', JSON.stringify(likedVideosCount));
            updateActionButtons(vPath);
            const btn = document.getElementById('like-btn');
            btn.classList.add('animate-scale-pulse');
            setTimeout(() => btn.classList.remove('animate-scale-pulse'), 300);
        };

        document.getElementById('bookmark-btn').onclick = () => {
            const vPath = currentPlaylist[currentVideoIndex];
            if (!vPath) return;
            if (bookmarkedVideos.includes(vPath)) bookmarkedVideos = bookmarkedVideos.filter(p => p !== vPath);
            else bookmarkedVideos.push(vPath);
            localStorage.setItem('bookmarks', JSON.stringify(bookmarkedVideos));
            updateActionButtons(vPath);
        };

        document.getElementById('scroll-down').onclick = nextVideo;
        document.getElementById('scroll-up').onclick = prevVideo;

        btnLoop.onclick = () => {
            isLoop = !isLoop;
            if(isLoop) { isAutoScroll = false; updateAutoScrollUI(); }
            updateLoopUI();
            const v = container.querySelector('video:last-child');
            if(v) v.loop = isLoop;
        };

        btnAuto.onclick = () => {
            isAutoScroll = !isAutoScroll;
            if(isAutoScroll) { isLoop = false; updateLoopUI(); }
            updateAutoScrollUI();
            const v = container.querySelector('video:last-child');
            if(v) v.loop = isLoop;
        };

        function updateLoopUI() { if(isLoop) btnLoop.classList.add('btn-active'); else btnLoop.classList.remove('btn-active'); }
        function updateAutoScrollUI() { if(isAutoScroll) btnAuto.classList.add('btn-active'); else btnAuto.classList.remove('btn-active'); }

        volSlider.oninput = (e) => {
            const val = e.target.value;
            const videos = document.querySelectorAll('video');
            videos.forEach(v => v.volume = val);
            const pct = val * 100;
            volProgress.style.width = pct + '%';
            volThumb.style.left = pct + '%';
            const icon = document.getElementById('vol-icon');
            if (val == 0) icon.innerText = 'volume_off';
            else if (val < 0.5) icon.innerText = 'volume_down';
            else icon.innerText = 'volume_up';
        };

        document.getElementById('mute-toggle').onclick = () => {
             const current = volSlider.value;
             if (current > 0) {
                 volSlider.setAttribute('data-prev', current);
                 volSlider.value = 0;
             } else {
                 volSlider.value = volSlider.getAttribute('data-prev') || 1;
             }
             volSlider.oninput({target: volSlider});
        }

        document.getElementById('feed-fyp').onclick = () => setFeed('fyp');
        document.getElementById('feed-bookmarks').onclick = () => setFeed('bookmarks');
        
        document.getElementById('aspect-ratio-toggle').onclick = () => {
            isFitMode = !isFitMode;
            const videos = document.querySelectorAll('video');
            videos.forEach(v => v.className = `video-wrapper ${isFitMode ? 'video-contain' : 'video-fit'}`);
        };

        document.getElementById('horizon-button').onclick = () => {
            isHorizontal = !isHorizontal;
            ipcRenderer.send('toggle-landscape', isHorizontal);
        };
    </script>
</body>
</html>
